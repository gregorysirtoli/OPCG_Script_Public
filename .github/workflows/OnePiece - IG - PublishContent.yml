name: OnePiece - IG - Publish Content

on:
  workflow_dispatch:
  schedule:
    # pubblica 1 bozza al giorno alle 17:47 UTC = 18:47 a Roma in inverno, 19:47 in estate (non allo scoccare
    # dell'ora, quando GitHub ritarda di piu' i job schedulati; i post vengono
    # generati alle 13:37 UTC, 4 ore prima); gli insights si leggono alle 19:47 UTC, allineati a questo orario
    - cron: "47 17 * * *"

jobs:
  publish-content:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Publish Instagram content
        run: |
          python -m src.instagram.publishContent
