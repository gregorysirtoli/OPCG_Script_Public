name: Run Sales Volume (Lorcana)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run MarketData (Lorcana)"]
    types:
      - completed

jobs:
  update-market-data:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      # Variabili richieste dallo script
      MONGODB_URI: ${{ secrets.MONGODB_URI_LORCANA }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_LORCANA }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      GAME: "LORCANA"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Sales Volume script
        run: |
          python -m src.metrics.getSalesVolume
