name: OnePiece - IG - Insights

# Ogni giorno: statistiche Instagram (copertura, visualizzazioni, salvataggi, condivisioni...) dei post pubblicati
# a 1, 2, 7 e 30 giorni, salvate in InstagramPosts.insights; il primo del mese anche il riepilogo per pipeline del mese
# prima (InstagramInsightsMonthly + mail). Il token deve avere il permesso instagram_business_manage_insights.
on:
  workflow_dispatch:
    inputs:
      summary:
        description: "Calcola e invia anche il riepilogo del mese prima"
        type: boolean
        default: false
  schedule:
    # 19:47 UTC, 2 ore dopo la pubblicazione (17:47 UTC): ogni checkpoint cade a N giorni + ~2h anche se
    # GitHub ritarda la pubblicazione, senza slittare al giorno dopo
    - cron: "47 19 * * *"

jobs:
  instagram-insights:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_INSIGHTS_SUMMARY: ${{ inputs.summary && '1' || '0' }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch Instagram insights
        run: |
          python -m src.instagram.insights
