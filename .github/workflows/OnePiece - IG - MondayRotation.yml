name: OnePiece - IG - Monday Rotation

# Ogni lunedi', a rotazione di quattro settimane: Market Movers pump (6 carte in salita), Market Insight promo,
# Market Movers dump (6 carte in discesa), Market Insight promo. Il turno lo sceglie lo script
# (generateSealedTierlist.monday_post); da GitHub si puo' forzare con l'input "post".
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post (auto = quello del calendario)"
        type: choice
        options: [auto, pump, dump, promo]
        default: auto
  schedule:
    - cron: "37 13 * * 1"

jobs:
  generate-monday-post:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      MONGODB_SALES_URI: ${{ secrets.MONGODB_SALES_URI_ONEPIECE }}
      MONGODB_SALES_DB: ${{ secrets.MONGODB_SALES_DB_ONEPIECE }}
      # caption scritte da Claude via Claude Code (abbonamento), vedi private_providers/instagram/aiCaption.py
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET }}
      GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64 }}
      MONDAY_POST: ${{ inputs.post || 'auto' }}
      INSTAGRAM_POST_INITIAL_STATUS: draft
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generate Monday Post
        run: |
          python -m src.instagram.monday_rotation
