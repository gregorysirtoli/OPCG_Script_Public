name: OnePiece - IG - Tierlist

on:
  workflow_dispatch:
    inputs:
      tierlist_id:
        description: "_id della tierlist (vuoto = TIERLIST_ID_EN)"
        required: false
        default: ""
  schedule:
    # ogni giovedi': lo step "Select tierlist" lascia proseguire solo l'ultimo giovedi' dei mesi dispari
    # (nei mesi pari quel giovedi' esce la Set Heatmap, OnePiece - IG - SetHeatmap.yml)
    - cron: "37 13 * * 4"

jobs:
  generate-tierlist:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      # caption scritte da Claude via Claude Code (abbonamento), vedi private_providers/instagram/aiCaption.py
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET }}
      GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64 }}
      # _id della tierlist: Main Expansion (English)
      TIERLIST_ID_EN: 6a9fe876bd29bfbb7e455276
      INSTAGRAM_POST_INITIAL_STATUS: draft
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Select tierlist (last Thursday of odd months, EN)
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIERLIST_ID: ${{ github.event.inputs.tierlist_id }}
        run: |
          day=$(date -u +%-d)
          month=$(date -u +%-m)
          # ultimo giovedi' = tra sette giorni e' gia' il mese dopo
          next_week_month=$(date -u -d "+7 days" +%-m)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$next_week_month" -eq "$month" ]; then
            echo "Day $day is not the last Thursday of the month: nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ] && [ $((month % 2)) -eq 0 ]; then
            echo "Month $month is even: the last Thursday is the Set Heatmap post, no tierlist"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_TIERLIST_ID" ]; then
            if ! [[ "$INPUT_TIERLIST_ID" =~ ^[0-9a-f]{24}$ ]]; then
              echo "Invalid tierlist_id: $INPUT_TIERLIST_ID" >&2
              exit 1
            fi
            id="$INPUT_TIERLIST_ID"
          else
            id="$TIERLIST_ID_EN"
          fi
          echo "Month $month -> TIERLIST_ID=$id"
          echo "TIERLIST_ID=$id" >> "$GITHUB_ENV"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generate Tierlist
        if: steps.plan.outputs.run == 'true'
        run: |
          python -m src.instagram.tierlist
