name: OnePiece - IG - Consultant

# Una volta al mese un agente Claude analizza in autonomia il canale Instagram (metriche, pubblico, immagini, commenti,
# pipeline e schedulazioni) e manda per mail un report da consulente: rischedulazioni, modifiche, eliminazioni, nuove
# idee e, se serve, una revisione profonda. Il brand (colori, font, forme, stile) resta invariato.
# Sicurezza: i token Instagram e MongoDB servono solo agli step dump e send; l'agente vede solo i file raccolti e il
# codice, senza credenziali, quindi non puo' pubblicare ne' scrivere nel database.
on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Domanda o tema su cui concentrare l'analisi (facoltativo)"
        type: string
        default: ""
  schedule:
    # il 2 del mese alle 07:47 UTC, dopo il riepilogo mensile degli insights del primo del mese
    - cron: "47 7 2 * *"

jobs:
  instagram-consultant:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers
          # niente token salvato in private_providers/.git: l'agente legge i file di questa cartella
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect Instagram data
        env:
          PYTHONUNBUFFERED: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
          MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          python -m src.instagram.consultant dump consultant_data
          mkdir -p consultant_out

      - name: Claude consultant
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Leggi il file private_providers/instagram/prompt/consultant.md e segui le sue istruzioni fino in fondo.
            Data di oggi: la trovi in consultant_data/data.json (generatedAt).
            Tema su cui il proprietario chiede di concentrarti (se vuoto, analisi generale): ${{ inputs.focus }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Write,Bash(python:*),Bash(python3:*),Bash(ls:*),Bash(wc:*),WebSearch,WebFetch"

      - name: Send report
        env:
          PYTHONUNBUFFERED: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
          MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          python -m src.instagram.consultant send consultant_out

      - name: Notify failure
        # dump e send mandano gia' la loro mail di errore
        if: failure() && steps.claude.outcome == 'failure'
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "import os; from src.core.emailer import send_email; send_email('🚫 [INSTAGRAM] Consultant agent failed', 'Run: <a href=\"' + os.environ['RUN_URL'] + '\">' + os.environ['RUN_URL'] + '</a>')"
