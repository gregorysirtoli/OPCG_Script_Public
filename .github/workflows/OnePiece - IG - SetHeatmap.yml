name: OnePiece - IG - Set Heatmap

# L'ultimo giovedi' dei mesi pari, al posto della Tierlist dei set (che esce nei mesi dispari): lo script controlla
# il giorno (generateSealedTierlist.thursday_post == "heatmap") e negli altri giovedi' non fa nulla.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Genera il post anche se oggi non e' l'ultimo giovedi' di un mese pari"
        type: boolean
        default: false
  schedule:
    - cron: "37 13 * * 4"

jobs:
  generate-set-heatmap:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET }}
      GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64 }}
      # caption scritte da Claude via Claude Code (abbonamento), vedi private_providers/instagram/aiCaption.py
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SET_HEATMAP_FORCE: ${{ inputs.force && '1' || '0' }}
      SET_HEATMAP_PERIOD: 30d
      INSTAGRAM_POST_INITIAL_STATUS: draft
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generate Set Heatmap
        run: |
          python -m src.instagram.set_heatmap
