name: Lorcana - MarketData

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Lorcana - Prices"]
    types:
      - completed

jobs:
  update-market-data:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: 1
      MONGODB_URI: ${{ secrets.MONGODB_URI_LORCANA }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_LORCANA }}
      MONGODB_SALES_URI: ${{ secrets.MONGODB_SALES_URI_LORCANA }}
      MONGODB_SALES_DB: ${{ secrets.MONGODB_SALES_DB_LORCANA }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      GAME: "LORCANA"
      PRIMARY_URL_TEMPLATE: ${{ secrets.PRIMARY_URL_TEMPLATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r src/prediction/requirements.txt

      - name: Run MarketData enrichment
        run: python -m src.ingest.marketData

      - name: Run Sales Volume script
        run: |
          python -m src.metrics.getSalesVolume

      - name: Run Tierlist script
        run: |
          python -m src.tierlist.getTierlist

      - name: Run update score script
        run: |
          python -m src.metrics.updateScore

      # ===== Prediction (ex "Lorcana - Prediction Daily") =====
      - name: Restore trained artifacts
        uses: actions/cache@v4
        with:
          path: artifacts
          key: optcg-artifacts-lorcana-${{ github.run_id }}
          restore-keys: |
            optcg-artifacts-lorcana-

      - name: Ensure model artifacts exist
        run: |
          if [ ! -f artifacts/optcg_quantile_artifacts.joblib ]; then
            echo "Missing artifacts/optcg_quantile_artifacts.joblib. Run mlTrain workflow first."
            exit 1
          fi

      - name: Run daily predictions
        run: |
          python -m src.prediction.run_predict
