name: OnePiece - IG - Grade It or Not

# Il quarto giovedi' dei mesi con cinque giovedi' (lo slot che resterebbe libero): lo script controlla il giorno
# (generateSealedTierlist.thursday_post == "grading") e negli altri giovedi' non fa nulla.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Genera il post anche se oggi non e' il quarto giovedi' di un mese con cinque giovedi'"
        type: boolean
        default: false
  schedule:
    - cron: "37 13 * * 4"

jobs:
  generate-grade-or-not:
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI_ONEPIECE }}
      MONGODB_DB: ${{ secrets.MONGODB_DB_ONEPIECE }}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET }}
      GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_STORAGE_SERVICE_ACCOUNT_B64 }}
      # caption scritte da Claude via Claude Code (abbonamento), vedi private_providers/instagram/aiCaption.py
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GRADE_OR_NOT_FORCE: ${{ inputs.force && '1' || '0' }}
      INSTAGRAM_POST_INITIAL_STATUS: draft
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private providers repo
        uses: actions/checkout@v4
        with:
          repository: gregorysirtoli/OPCG_Script_Private
          token: ${{ secrets.PROVIDERS_TOKEN }}
          path: private_providers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generate Grade It or Not
        run: |
          python -m src.instagram.grade_or_not
